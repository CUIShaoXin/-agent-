[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimum-viable-agent"
version = "0.1.0"
description = "A minimal agent runtime built from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.3,<2",
    "dashscope>=1.26,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-chroma>=1.1,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-core>=1.2,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "pydantic>=2.10,<3",
    "pymysql>=1.1,<2",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
mini-agent = "min_agent.cli:main"
build-knowledge = "min_agent.knowledge_builder:main"

[tool.setuptools.packages.find]
where = ["src"]
